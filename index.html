<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irfan Fashion Tailor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Irfan Fashion Tailor</h2>
        <p>Book an Appointment or Inquiry</p>

        <!-- Google Maps Link -->
        <p>
             <a href="https://www.google.com/maps/place/?q=place_id:ChIJ06u-hJ_BwjsRgCNj8XWQy0o" target="_blank" style="text-decoration: none; color: #1a73e8; display: inline-flex; align-items: center; gap: 6px;">
        <!-- Maps Icon SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#4285F4">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        View Irfan Fashion Tailor on Google Maps
    </a>
        </p>

        <!-- Inquiry Form -->
        <form id="inquiryForm">
            <input type="text" id="name" placeholder="Enter Your Full Name" required>
            
            <select id="service" required>
                <option value="">Select Tailoring Service</option>
                <option value="Pant Stitching">Pant Stitching</option>
                <option value="Shirt Stitching">Shirt Stitching</option>
                <option value="School Uniform">School Uniform</option>
            </select>

            <input type="tel" id="phone" placeholder="Enter Your Mobile Number" required>
            <input type="text" id="location" placeholder="Enter your area or Address in Pune" required>

            <button type="submit" id="whatsappBtn">Inquiry via WhatsApp</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
